name: Ayna repolara böl

# Packagist ve SwiftPM alt klasörden paket okuyamaz: `composer.json` ve
# `Package.swift` repo KÖKÜNDE olmak zorunda, sürüm çözümü de kök tag'lerinden
# yapılır. Bu yüzden her tag'de bu iki paket kendi salt-okunur repolarına
# kopyalanır. Ayna repolara elle dokunulmaz.
#
# npm ve Maven Central böyle bir kısıt koymaz; onlar doğrudan bu repodan yayınlanır.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: php
            repo: Pariette-Inc/submit.sdk-php
          - package: swift
            repo: Pariette-Inc/submit.sdk-swift
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Sürümü çöz
        id: version
        run: echo "tag=${GITHUB_REF_NAME:-manual-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Ayna içeriğini hazırla
        run: |
          rm -rf /tmp/mirror && mkdir -p /tmp/mirror
          cp -R packages/${{ matrix.package }}/. /tmp/mirror/
          cp LICENSE /tmp/mirror/ 2>/dev/null || true
          # spec ayna içinde de dursun: paketin hangi API sürümünü hedeflediği
          # ayna repoya bakan biri için de görünür olmalı.
          mkdir -p /tmp/mirror/spec && cp spec/endpoints.json /tmp/mirror/spec/
          cat >> /tmp/mirror/README.md <<'NOTE'

          ---

          > **Bu repo otomatik üretilir.** Kaynak:
          > [Pariette-Inc/submit.sdk](https://github.com/Pariette-Inc/submit.sdk)
          > (`packages/${{ matrix.package }}`). Buraya atılan commit'ler bir sonraki
          > yayında kaybolur — değişiklikleri kaynak repoda yapın.
          NOTE

      - name: Aynaya it
        env:
          TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          cd /tmp/mirror
          git init -q -b main
          git config user.name "submitcms-bot"
          git config user.email "bot@submitcms.com"
          git add -A
          git commit -q -m "${{ steps.version.outputs.tag }} — submit.sdk@${GITHUB_SHA::7} kaynağından"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ matrix.repo }}.git"
          # Ayna tam kopyadır; geçmişi kaynak repoda tutuyoruz.
          git push -f origin main
          git tag "${{ steps.version.outputs.tag }}"
          git push -f origin "${{ steps.version.outputs.tag }}"

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
        working-directory: packages/js
      - run: npm publish --access public
        working-directory: packages/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      # Maven Central `com.submitcms` namespace'inin alan adı doğrulamasını ve
      # GPG imzalama anahtarını ister; ikisi de bir kez elle kurulur.
      - run: gradle publish --no-daemon
        working-directory: packages/kotlin
        env:
          SDK_VERSION: ${{ github.ref_name }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
